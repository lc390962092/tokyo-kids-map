<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Kids Map - 底部卡片 mobile 版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #fff; color: #2c3834; }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .sheet { transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); }
    .chip { transition: all 0.15s ease; }
    .chip.on { background: #ff8c73; color: white; border-color: #ff8c73; }
    .chip.off { background: white; color: #76584e; border-color: #f2d8cb; }
    .map-bg { background: linear-gradient(160deg, #e3f0eb 0%, #f8efe8 60%, #e6ece9 100%); }
  </style>
</head>
<body class="h-screen w-full overflow-hidden relative">
  <!-- 地图层 -->
  <div class="absolute inset-0 map-bg flex items-center justify-center">
    <div class="text-center">
      <div class="text-6xl mb-2">🗾</div>
      <p class="text-[#5a6b64] font-medium text-sm">MapLibre GL · 东京亲子地点</p>
    </div>
  </div>

  <!-- 顶部搜索 + 快捷筛选 -->
  <div class="absolute top-0 left-0 right-0 z-20 p-4 space-y-3 pointer-events-none">
    <div class="flex gap-2 pointer-events-auto">
      <div class="flex-1 relative">
        <svg class="absolute left-3 top-2.5 w-4 h-4 text-[#c4a99b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="search" type="text" placeholder="搜索地点、车站、行政区..." class="w-full rounded-full border border-[#f2d8cb] bg-white/95 backdrop-blur py-2 pl-9 pr-4 text-sm font-medium shadow-sm outline-none focus:border-[#ff8c73]">
      </div>
      <button id="favBtn" class="w-10 h-10 rounded-full bg-white/95 backdrop-blur border border-[#f2d8cb] flex items-center justify-center shadow-sm text-[#c4a99b]">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </button>
    </div>

    <div class="flex gap-2 overflow-x-auto scrollbar-hide pointer-events-auto pb-1">
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="age" data-val="0-1">0-1岁</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="age" data-val="1-3">1-3岁</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="age" data-val="3-6">3-6岁</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="age" data-val="6+">6岁+</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="feature" data-val="free">免费</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="feature" data-val="rainy_day">雨天</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="feature" data-val="stroller_friendly">推车</button>
      <button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold whitespace-nowrap" data-type="feature" data-val="parking_easy">停车</button>
      <button id="moreFilter" class="rounded-full border border-[#f2d8cb] bg-white/95 px-3 py-1.5 text-xs font-bold text-[#76584e] whitespace-nowrap">更多 ▾</button>
    </div>
  </div>

  <!-- 更多筛选弹窗 -->
  <div id="filterModal" class="absolute inset-0 z-30 hidden bg-black/20 backdrop-blur-sm flex items-end">
    <div class="bg-white w-full max-h-[75vh] rounded-t-3xl p-5">
      <div class="flex items-center justify-between mb-4">
        <h3 class="font-black text-lg">更多筛选</h3>
        <button id="closeFilter" class="w-8 h-8 rounded-full bg-[#f8f3ef] text-[#76584e] flex items-center justify-center">✕</button>
      </div>
      <div class="space-y-5 overflow-y-auto max-h-[55vh] pr-1">
        <section>
          <h4 class="text-sm font-black text-[#3b4a45] mb-2">分类</h4>
          <div class="flex flex-wrap gap-2" id="modal-cats"></div>
        </section>
        <section>
          <h4 class="text-sm font-black text-[#3b4a45] mb-2">年龄</h4>
          <div class="flex flex-wrap gap-2" id="modal-ages"></div>
        </section>
        <section>
          <h4 class="text-sm font-black text-[#3b4a45] mb-2">特点</h4>
          <div class="space-y-2" id="modal-feats"></div>
        </section>
        <section>
          <h4 class="text-sm font-black text-[#3b4a45] mb-2">排序</h4>
          <select id="modalSort" class="w-full rounded-xl border border-[#f2d8cb] bg-white px-3 py-2 text-sm font-medium">
            <option value="relevance">综合推荐</option>
            <option value="rating">评分从高到低</option>
            <option value="name">名称 A-Z</option>
          </select>
        </section>
      </div>
      <div class="mt-4 pt-4 border-t border-[#f2d8cb] flex gap-3">
        <button id="resetAll" class="flex-1 rounded-full border border-[#f2d8cb] py-2.5 text-sm font-bold text-[#76584e]">重置</button>
        <button id="applyFilter" class="flex-1 rounded-full bg-[#ff8c73] py-2.5 text-sm font-bold text-white shadow-md">确定</button>
      </div>
    </div>
  </div>

  <!-- 底部可拖拽卡片 -->
  <div id="bottomSheet" class="absolute bottom-0 left-0 right-0 z-20">
    <div id="sheetHandle" class="bg-white rounded-t-3xl shadow-[0_-4px_24px_rgba(0,0,0,0.08)] border-t border-[#f2d8cb] overflow-hidden">
      <div class="w-full flex justify-center pt-2 pb-1 cursor-grab active:cursor-grabbing" id="dragHandle">
        <div class="w-10 h-1 rounded-full bg-[#e0d3ca]"></div>
      </div>
      <div class="px-4 pb-3 flex items-center justify-between">
        <h3 class="font-black text-base">搜索结果 <span id="count" class="text-[#ff8c73]">0</span></h3>
        <div class="flex gap-2">
          <button id="sortBtn" class="text-xs font-bold text-[#76584e] px-2 py-1 rounded-lg bg-[#f8f3ef]">排序</button>
          <button id="expandBtn" class="text-[#c4a99b]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/></svg>
          </button>
        </div>
      </div>
      <div id="cardList" class="px-4 pb-6 overflow-x-auto flex gap-3 scrollbar-hide" style="height: 200px;">
        <!-- cards -->
      </div>
    </div>
  </div>

  <script>
    const places = [
      { id:1, nameZh:"荒川自然公园", nameJa:"荒川自然公園", category:"park", ward:"荒川区", freeEntry:true, rainyDay:false, indoor:false, ageMin:1, ageMax:10, strollerScore:4, diaperScore:3, parkingScore:2, playScore:5, description:"大片绿地、交通园和水边步道，荒川区经典放电点。", img:"https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=300" },
      { id:2, nameZh:"汐入公园", nameJa:"汐入公園", category:"park", ward:"荒川区", freeEntry:true, rainyDay:false, indoor:false, ageMin:0, ageMax:10, strollerScore:5, diaperScore:3, parkingScore:3, playScore:5, description:"隅田川边大型公园，草地和 playground 适合亲子。", img:"https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=300" },
      { id:3, nameZh:"上野动物园", nameJa:"上野動物園", category:"zoo", ward:"台东区", freeEntry:false, rainyDay:false, indoor:false, ageMin:1, ageMax:10, strollerScore:4, diaperScore:4, parkingScore:2, playScore:5, description:"东京经典动物园，适合安排半天到一天。", img:"https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=300" },
      { id:4, nameZh:"墨田水族馆", nameJa:"すみだ水族館", category:"aquarium", ward:"墨田区", freeEntry:false, rainyDay:true, indoor:true, ageMin:0, ageMax:10, strollerScore:4, diaperScore:4, parkingScore:4, playScore:3, description:"晴空塔内水族馆，低龄宝宝也容易看完。", img:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=300" },
      { id:5, nameZh:"国立科学博物馆", nameJa:"国立科学博物館", category:"museum", ward:"台东区", freeEntry:false, rainyDay:true, indoor:true, ageMin:3, ageMax:10, strollerScore:4, diaperScore:4, parkingScore:2, playScore:4, description:"恐龙和互动展示丰富，雨天或酷暑的高质量室内选择。", img:"https://images.unsplash.com/photo-1566127444979-b3d2b654e3d7?w=300" },
      { id:6, nameZh:"东京晴空塔", nameJa:"東京スカイツリー", category:"landmark", ward:"墨田区", freeEntry:false, rainyDay:true, indoor:true, ageMin:0, ageMax:10, strollerScore:5, diaperScore:5, parkingScore:4, playScore:3, description:"商场、水族馆、观景台和餐饮集中。", img:"https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?w=300" },
      { id:7, nameZh:"阳光城水族馆", nameJa:"サンシャイン池袋水族館", category:"aquarium", ward:"丰岛区", freeEntry:false, rainyDay:true, indoor:true, ageMin:0, ageMax:12, strollerScore:5, diaperScore:5, parkingScore:4, playScore:5, description:"阳光城内水族馆，海洋现场感强。", img:"https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=300" },
      { id:8, nameZh:"teamLab Planets", nameJa:"teamLab Planets", category:"museum", ward:"江东区", freeEntry:false, rainyDay:true, indoor:true, ageMin:4, ageMax:15, strollerScore:2, diaperScore:4, parkingScore:3, playScore:5, description:"戏水互动，沉浸式光影。", img:"https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=300" },
    ];
    const catLabel = {park:"公园",zoo:"动物园",aquarium:"水族馆",museum:"博物馆",indoor_play:"室内游乐",library:"图书馆",children_center:"儿童馆",landmark:"地标"};
    const fav = new Set([2,4]);
    let filters = { q:"", age:null, cats:[], feats:[], onlyFav:false, sort:"relevance" };
    let expanded = false;

    function doFilter() {
      let r = places.filter(p => {
        if (filters.age) {
          const map = {"0-1":[0,1],"1-3":[1,3],"3-6":[3,6],"6+":[6,10]};
          const [mn,mx] = map[filters.age];
          if (p.ageMin>mx || p.ageMax<mn) return false;
        }
        if (filters.cats.length && !filters.cats.includes(p.category)) return false;
        if (filters.feats.includes("free") && !p.freeEntry) return false;
        if (filters.feats.includes("rainy_day") && !p.rainyDay) return false;
        if (filters.feats.includes("stroller_friendly") && p.strollerScore<4) return false;
        if (filters.feats.includes("parking_easy") && p.parkingScore<4) return false;
        if (filters.q && ![p.nameZh,p.nameJa,p.ward,catLabel[p.category],p.description].join(" ").toLowerCase().includes(filters.q.toLowerCase())) return false;
        if (filters.onlyFav && !fav.has(p.id)) return false;
        return true;
      });
      if (filters.sort==="rating") r.sort((a,b)=>b.playScore-a.playScore);
      if (filters.sort==="name") r.sort((a,b)=>a.nameZh.localeCompare(b.nameZh,"zh"));
      return r;
    }
    function render() {
      const r = doFilter();
      document.getElementById("count").textContent = r.length;
      const list = document.getElementById("cardList");
      list.innerHTML = r.map(p => `
        <div class="flex-shrink-0 ${expanded?'w-full':'w-64'} rounded-2xl border border-[#f2d8cb] bg-white overflow-hidden shadow-sm">
          <div class="relative h-24">
            <img src="${p.img}" class="w-full h-full object-cover" alt="${p.nameZh}">
            <button class="fav-btn absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 flex items-center justify-center text-[#c4a99b]" data-id="${p.id}">
              <svg class="w-4 h-4" fill="${fav.has(p.id)?'currentColor':'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            </button>
          </div>
          <div class="p-3">
            <h4 class="font-black text-sm text-[#2c3834] truncate">${p.nameZh}</h4>
            <p class="text-xs text-[#8a6b5e] mt-0.5">${p.ward} · ${catLabel[p.category]}</p>
            <p class="text-xs text-[#76584e] mt-1 line-clamp-2">${p.description}</p>
            <div class="flex gap-1 mt-2">
              ${p.freeEntry?'<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#e8f5ee] text-[#46b37b] font-bold">免费</span>':''}
              ${p.rainyDay?'<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#eef4fb] text-[#4a9bd8] font-bold">雨天</span>':''}
            </div>
          </div>
        </div>
      `).join("");
      list.querySelectorAll(".fav-btn").forEach(b => b.addEventListener("click", e => { e.stopPropagation(); const id=+b.dataset.id; fav.has(id)?fav.delete(id):fav.add(id); render(); }));
    }

    function setChipUI() {
      document.querySelectorAll(".chip[data-type]").forEach(c => {
        const t=c.dataset.type, v=c.dataset.val;
        let on=false;
        if (t==="age") on = filters.age===v;
        if (t==="category") on = filters.cats.includes(v);
        if (t==="feature") on = filters.feats.includes(v);
        c.classList.toggle("on", on); c.classList.toggle("off", !on);
      });
      document.getElementById("favBtn").classList.toggle("text-red-500", filters.onlyFav);
      document.getElementById("favBtn").classList.toggle("text-[#c4a99b]", !filters.onlyFav);
    }

    document.getElementById("search").addEventListener("input", e => { filters.q=e.target.value; render(); });
    document.querySelectorAll(".chip[data-type]").forEach(b => b.addEventListener("click", () => {
      const t=b.dataset.type, v=b.dataset.val;
      if (t==="age") filters.age = filters.age===v?null:v;
      if (t==="category") filters.cats = filters.cats.includes(v)?filters.cats.filter(x=>x!==v):[...filters.cats,v];
      if (t==="feature") filters.feats = filters.feats.includes(v)?filters.feats.filter(x=>x!==v):[...filters.feats,v];
      setChipUI(); render();
    }));
    document.getElementById("favBtn").addEventListener("click", () => { filters.onlyFav=!filters.onlyFav; setChipUI(); render(); });

    // 更多筛选弹窗
    function buildModal() {
      document.getElementById("modal-cats").innerHTML = ["park","zoo","aquarium","museum","indoor_play","library","children_center"].map(c =>
        `<button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold" data-type="category" data-val="${c}">${catLabel[c]}</button>`
      ).join("");
      document.getElementById("modal-ages").innerHTML = ["0-1","1-3","3-6","6+"].map(a =>
        `<button class="chip off rounded-full border px-3 py-1.5 text-xs font-bold" data-type="age" data-val="${a}">${a}岁</button>`
      ).join("");
      document.getElementById("modal-feats").innerHTML = [
        ["free","免费"],["rainy_day","雨天可去"],["stroller_friendly","婴儿车友好"],["parking_easy","停车方便"]
      ].map(([k,l]) => `<label class="flex items-center justify-between rounded-xl border border-[#f2d8cb] bg-white px-3 py-2"><span class="text-sm font-bold text-[#76584e]">${l}</span><input type="checkbox" class="modal-feat w-5 h-5 accent-[#ff8c73]" data-val="${k}"></label>`).join("");
      document.getElementById("modalSort").value = filters.sort;
      syncModal();
    }
    function syncModal() {
      document.querySelectorAll("#modal-cats .chip, #modal-ages .chip").forEach(c => {
        const t=c.dataset.type, v=c.dataset.val;
        let on=false;
        if (t==="age") on = filters.age===v;
        if (t==="category") on = filters.cats.includes(v);
        c.classList.toggle("on", on); c.classList.toggle("off", !on);
      });
      document.querySelectorAll(".modal-feat").forEach(cb => cb.checked = filters.feats.includes(cb.dataset.val));
    }
    buildModal();

    document.getElementById("moreFilter").addEventListener("click", () => { syncModal(); document.getElementById("filterModal").classList.remove("hidden"); });
    document.getElementById("closeFilter").addEventListener("click", () => document.getElementById("filterModal").classList.add("hidden"));
    document.getElementById("filterModal").addEventListener("click", e => { if (e.target.id==="filterModal") document.getElementById("filterModal").classList.add("hidden"); });
    document.querySelectorAll("#modal-cats, #modal-ages").forEach(el => el.addEventListener("click", e => {
      const b=e.target.closest(".chip"); if (!b) return;
      const t=b.dataset.type, v=b.dataset.val;
      if (t==="age") filters.age = filters.age===v?null:v;
      if (t==="category") filters.cats = filters.cats.includes(v)?filters.cats.filter(x=>x!==v):[...filters.cats,v];
      syncModal(); setChipUI(); render();
    }));
    document.getElementById("modal-feats").addEventListener("change", () => {
      filters.feats = [...document.querySelectorAll(".modal-feat:checked")].map(cb => cb.dataset.val);
      setChipUI(); render();
    });
    document.getElementById("modalSort").addEventListener("change", e => { filters.sort=e.target.value; render(); });
    document.getElementById("applyFilter").addEventListener("click", () => document.getElementById("filterModal").classList.add("hidden"));
    document.getElementById("resetAll").addEventListener("click", () => {
      filters={q:"",age:null,cats:[],feats:[],onlyFav:false,sort:"relevance"};
      document.getElementById("search").value="";
      syncModal(); setChipUI(); render();
    });

    // 底部卡片展开/收起
    document.getElementById("expandBtn").addEventListener("click", () => {
      expanded=!expanded;
      const list=document.getElementById("cardList"), handle=document.getElementById("dragHandle");
      list.style.height = expanded ? "calc(100% - 80px)" : "200px";
      list.classList.toggle("flex-wrap", expanded);
      list.classList.toggle("overflow-x-auto", !expanded);
      handle.style.display = expanded ? "none" : "flex";
      document.getElementById("expandBtn").querySelector("svg").style.transform = expanded ? "rotate(180deg)" : "";
      render();
    });

    render();
  </script>
</body>
</html>
