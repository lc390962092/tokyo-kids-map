<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo Kids Map - 侧边栏 calm 版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fffaf4;
      color: #2c3834;
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    .chip-active {
      background: #ff8c73;
      color: white;
      border-color: #ff8c73;
    }
    .chip-inactive {
      background: white;
      color: #76584e;
      border-color: #f2d8cb;
    }
    .favorite-btn:hover { transform: scale(1.05); }
    .favorite-btn:active { transform: scale(0.95); }
    .map-placeholder {
      background: linear-gradient(135deg, #e8f4f0 0%, #f5ebe3 50%, #e0e8e6 100%);
    }
  </style>
</head>
<body class="h-screen w-full overflow-hidden">
  <div class="flex h-full">
    <!-- 侧边栏筛选 -->
    <aside class="w-80 flex-shrink-0 flex flex-col h-full bg-[#fffaf4] border-r border-[#f6ded2]">
      <div class="p-5 border-b border-[#f6ded2]">
        <div class="flex items-center gap-2 text-sm font-semibold text-[#f27d68]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
          筛选地点
        </div>
        <h1 class="mt-2 text-2xl font-black text-[#2c3834]">东京溜娃地图</h1>
        <p class="mt-1 text-sm font-medium text-[#8a6b5e]">Tokyo Kids Map · <span id="result-count">131</span> 个地点</p>
      </div>

      <div class="flex-1 overflow-y-auto p-5 space-y-6 scrollbar-hide">
        <!-- 搜索 -->
        <div class="relative">
          <svg class="absolute left-3 top-2.5 w-4 h-4 text-[#c4a99b]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input
            id="search-input"
            type="text"
            placeholder="搜索地点、区域、车站..."
            class="w-full rounded-full border border-[#f2d8cb] bg-white py-2 pl-9 pr-4 text-sm font-medium placeholder:text-[#c4a99b] focus:border-[#ff8c73] focus:outline-none focus:ring-2 focus:ring-[#ff8c73]/20"
          >
        </div>

        <!-- 只看收藏 -->
        <div class="flex items-center justify-between rounded-2xl border border-[#f2d8cb] bg-white px-4 py-3">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-red-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
            <span class="text-sm font-bold text-[#76584e]">只看收藏</span>
          </div>
          <button id="fav-toggle" class="relative h-6 w-11 rounded-full bg-[#f2d8cb] transition">
            <span class="absolute top-1 left-1 h-4 w-4 rounded-full bg-white transition"></span>
          </button>
        </div>

        <!-- 年龄 -->
        <section>
          <h2 class="mb-3 text-sm font-black text-[#3b4a45]">年龄</h2>
          <div class="grid grid-cols-2 gap-2">
            <button class="filter-age rounded-full border px-3 py-2 text-xs font-bold transition chip-inactive" data-age="0-1">0-1岁</button>
            <button class="filter-age rounded-full border px-3 py-2 text-xs font-bold transition chip-inactive" data-age="1-3">1-3岁</button>
            <button class="filter-age rounded-full border px-3 py-2 text-xs font-bold transition chip-inactive" data-age="3-6">3-6岁</button>
            <button class="filter-age rounded-full border px-3 py-2 text-xs font-bold transition chip-inactive" data-age="6+">6岁+</button>
          </div>
        </section>

        <!-- 分类 -->
        <section>
          <h2 class="mb-3 text-sm font-black text-[#3b4a45]">分类</h2>
          <div class="flex flex-wrap gap-2" id="category-chips">
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="park">公园</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="zoo">动物园</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="aquarium">水族馆</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="museum">博物馆</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="indoor_play">室内游乐</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="library">图书馆</button>
            <button class="filter-category rounded-full border px-3 py-1.5 text-xs font-bold transition chip-inactive" data-category="children_center">儿童馆</button>
          </div>
        </section>

        <!-- 特点 -->
        <section>
          <h2 class="mb-3 text-sm font-black text-[#3b4a45]">特点</h2>
          <div class="space-y-2">
            <label class="flex items-center justify-between rounded-2xl border border-[#f2d8cb] bg-white px-4 py-3 cursor-pointer">
              <span class="text-sm font-bold text-[#76584e]">免费</span>
              <input type="checkbox" class="filter-feature w-5 h-5 accent-[#ff8c73]" data-feature="free">
            </label>
            <label class="flex items-center justify-between rounded-2xl border border-[#f2d8cb] bg-white px-4 py-3 cursor-pointer">
              <span class="text-sm font-bold text-[#76584e]">雨天可去</span>
              <input type="checkbox" class="filter-feature w-5 h-5 accent-[#ff8c73]" data-feature="rainy_day">
            </label>
            <label class="flex items-center justify-between rounded-2xl border border-[#f2d8cb] bg-white px-4 py-3 cursor-pointer">
              <span class="text-sm font-bold text-[#76584e]">婴儿车友好</span>
              <input type="checkbox" class="filter-feature w-5 h-5 accent-[#ff8c73]" data-feature="stroller_friendly">
            </label>
            <label class="flex items-center justify-between rounded-2xl border border-[#f2d8cb] bg-white px-4 py-3 cursor-pointer">
              <span class="text-sm font-bold text-[#76584e]">停车方便</span>
              <input type="checkbox" class="filter-feature w-5 h-5 accent-[#ff8c73]" data-feature="parking_easy">
            </label>
          </div>
        </section>

        <!-- 排序 -->
        <section>
          <h2 class="mb-3 text-sm font-black text-[#3b4a45]">排序</h2>
          <select id="sort-select" class="w-full rounded-xl border border-[#f2d8cb] bg-white px-3 py-2.5 text-sm font-medium text-[#76584e]">
            <option value="relevance">综合推荐</option>
            <option value="rating">评分从高到低</option>
            <option value="name">名称 A-Z</option>
          </select>
        </section>
      </div>

      <!-- 底部操作 -->
      <div class="p-5 border-t border-[#f6ded2]">
        <button id="reset-btn" class="w-full rounded-full border border-[#f2d8cb] bg-white py-2.5 text-sm font-bold text-[#76584e] hover:bg-[#fff0e8] transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.935 8.5M4 20v-5m0 0h.581m15.357 0A8.001 8.001 0 004.936 15.5"></path></svg>
          重置筛选
        </button>
      </div>
    </aside>

    <!-- 右侧地图 + 结果浮层 -->
    <main class="relative flex-1 h-full">
      <div class="map-placeholder absolute inset-0 flex items-center justify-center">
        <div class="text-center">
          <div class="text-6xl mb-3">🗾</div>
          <p class="text-[#8a6b5e] font-medium">地图区域 · 131 个地点分布</p>
          <p class="text-sm text-[#c4a99b] mt-1">（此处为 MapLibre GL 地图占位）</p>
        </div>
      </div>

      <!-- 结果卡片浮层 -->
      <div class="absolute bottom-6 left-6 right-6 h-64 bg-white/95 backdrop-blur rounded-3xl border border-[#f2d8cb] shadow-xl overflow-hidden flex flex-col">
        <div class="px-5 py-3 border-b border-[#f2d8cb] flex items-center justify-between">
          <h3 class="font-black text-[#2c3834]">搜索结果 <span id="list-count" class="text-[#ff8c73]">131</span></h3>
          <button id="collapse-list" class="text-[#c4a99b] hover:text-[#76584e]">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          </button>
        </div>
        <div id="result-list" class="flex-1 overflow-x-auto overflow-y-hidden flex gap-3 p-4 scrollbar-hide">
          <!-- 卡片由 JS 生成 -->
        </div>
      </div>
    </main>
  </div>

  <script>
    const places = [
      { id: 1, nameZh: "荒川自然公园", nameJa: "荒川自然公園", category: "park", ward: "荒川区", freeEntry: true, rainyDay: false, indoor: false, ageMin: 1, ageMax: 10, strollerScore: 4, diaperScore: 3, parkingScore: 2, playScore: 5, description: "有大片绿地、交通园和水边步道，是荒川区经典放电点。", imageUrl: "https://images.unsplash.com/photo-1519331379826-f10be5486c6f?w=200" },
      { id: 2, nameZh: "汐入公园", nameJa: "汐入公園", category: "park", ward: "荒川区", freeEntry: true, rainyDay: false, indoor: false, ageMin: 0, ageMax: 10, strollerScore: 5, diaperScore: 3, parkingScore: 3, playScore: 5, description: "隅田川边的大型公园，视野开阔，草地和 playground 都很适合亲子。", imageUrl: "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=200" },
      { id: 3, nameZh: "上野动物园", nameJa: "上野動物園", category: "zoo", ward: "台东区", freeEntry: false, rainyDay: false, indoor: false, ageMin: 1, ageMax: 10, strollerScore: 4, diaperScore: 4, parkingScore: 2, playScore: 5, description: "东京经典动物园，动物种类丰富，适合安排半天到一天。", imageUrl: "https://images.unsplash.com/photo-1546182990-dffeafbe841d?w=200" },
      { id: 4, nameZh: "墨田水族馆", nameJa: "すみだ水族館", category: "aquarium", ward: "墨田区", freeEntry: false, rainyDay: true, indoor: true, ageMin: 0, ageMax: 10, strollerScore: 4, diaperScore: 4, parkingScore: 4, playScore: 3, description: "晴空塔内的城市水族馆，动线紧凑，低龄宝宝也容易看完。", imageUrl: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=200" },
      { id: 5, nameZh: "国立科学博物馆", nameJa: "国立科学博物館", category: "museum", ward: "台东区", freeEntry: false, rainyDay: true, indoor: true, ageMin: 3, ageMax: 10, strollerScore: 4, diaperScore: 4, parkingScore: 2, playScore: 4, description: "恐龙、自然科学和互动展示丰富，雨天或酷暑天的高质量室内选择。", imageUrl: "https://images.unsplash.com/photo-1566127444979-b3d2b654e3d7?w=200" },
      { id: 6, nameZh: "东京晴空塔", nameJa: "東京スカイツリー", category: "landmark", ward: "墨田区", freeEntry: false, rainyDay: true, indoor: true, ageMin: 0, ageMax: 10, strollerScore: 5, diaperScore: 5, parkingScore: 4, playScore: 3, description: "商场、水族馆、观景台和餐饮集中，天气不好时也能安排完整亲子半日。", imageUrl: "https://images.unsplash.com/photo-1536098561742-ca998e48cbcc?w=200" },
      { id: 7, nameZh: "阳光城水族馆", nameJa: "サンシャイン池袋水族館", category: "aquarium", ward: "丰岛区", freeEntry: false, rainyDay: true, indoor: true, ageMin: 0, ageMax: 12, strollerScore: 5, diaperScore: 5, parkingScore: 4, playScore: 5, description: "阳光城内水族馆，海洋现场感极强。", imageUrl: "https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=200" },
      { id: 8, nameZh: "teamLab Planets", nameJa: "teamLab Planets", category: "museum", ward: "江东区", freeEntry: false, rainyDay: true, indoor: true, ageMin: 4, ageMax: 15, strollerScore: 2, diaperScore: 4, parkingScore: 3, playScore: 5, description: "戏水互动，沉浸式光影。", imageUrl: "https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=200" },
    ];

    const categoryLabels = {
      park: "公园", zoo: "动物园", aquarium: "水族馆", museum: "博物馆",
      indoor_play: "室内游乐", library: "图书馆", children_center: "儿童馆",
      landmark: "地标"
    };

    let filters = {
      query: "",
      ageRange: null,
      categories: [],
      features: [],
      onlyFavorites: false,
      sortBy: "relevance"
    };

    const favorites = new Set([2, 4]);

    function filterPlaces() {
      let result = places.filter(p => {
        if (filters.ageRange) {
          const map = { "0-1": [0,1], "1-3": [1,3], "3-6": [3,6], "6+": [6,10] };
          const [min, max] = map[filters.ageRange];
          if (p.ageMin > max || p.ageMax < min) return false;
        }
        if (filters.categories.length && !filters.categories.includes(p.category)) return false;
        for (const f of filters.features) {
          if (f === "free" && !p.freeEntry) return false;
          if (f === "rainy_day" && !p.rainyDay) return false;
          if (f === "stroller_friendly" && p.strollerScore < 4) return false;
          if (f === "parking_easy" && p.parkingScore < 4) return false;
        }
        if (filters.query) {
          const q = filters.query.toLowerCase();
          const text = [p.nameZh, p.nameJa, p.ward, categoryLabels[p.category], p.description].join(" ").toLowerCase();
          if (!text.includes(q)) return false;
        }
        if (filters.onlyFavorites && !favorites.has(p.id)) return false;
        return true;
      });

      if (filters.sortBy === "rating") {
        result.sort((a, b) => b.playScore - a.playScore);
      } else if (filters.sortBy === "name") {
        result.sort((a, b) => a.nameZh.localeCompare(b.nameZh, "zh-CN"));
      }
      return result;
    }

    function renderList() {
      const result = filterPlaces();
      const container = document.getElementById("result-list");
      container.innerHTML = "";

      document.getElementById("result-count").textContent = result.length;
      document.getElementById("list-count").textContent = result.length;

      if (result.length === 0) {
        container.innerHTML = `<div class="w-full flex flex-col items-center justify-center text-[#8a6b5e]"><p class="text-sm">没有找到符合条件的地点</p></div>`;
        return;
      }

      result.forEach(p => {
        const isFav = favorites.has(p.id);
        const card = document.createElement("div");
        card.className = "flex-shrink-0 w-64 bg-white rounded-2xl border border-[#f2d8cb] overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer";
        card.innerHTML = `
          <div class="h-28 bg-gray-100 relative">
            <img src="${p.imageUrl}" class="w-full h-full object-cover" alt="${p.nameZh}">
            <button class="favorite-btn absolute top-2 right-2 w-8 h-8 rounded-full ${isFav ? 'bg-red-50 text-red-500' : 'bg-white/90 text-[#c4a99b]'} flex items-center justify-center shadow-sm transition" data-id="${p.id}">
              <svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path></svg>
            </button>
          </div>
          <div class="p-3">
            <h4 class="font-black text-[#2c3834] text-sm truncate">${p.nameZh}</h4>
            <p class="text-xs text-[#8a6b5e] mt-0.5">${p.ward} · ${categoryLabels[p.category]}</p>
            <p class="text-xs text-[#76584e] mt-1 line-clamp-2">${p.description}</p>
            <div class="flex gap-1 mt-2">
              ${p.freeEntry ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#e8f5ee] text-[#46b37b] font-bold">免费</span>' : ""}
              ${p.rainyDay ? '<span class="text-[10px] px-2 py-0.5 rounded-full bg-[#eef4fb] text-[#4a9bd8] font-bold">雨天</span>' : ""}
            </div>
          </div>
        `;
        card.querySelector(".favorite-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          if (favorites.has(p.id)) favorites.delete(p.id); else favorites.add(p.id);
          renderList();
        });
        container.appendChild(card);
      });
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      filters.query = e.target.value;
      renderList();
    });

    document.querySelectorAll(".filter-age").forEach(btn => {
      btn.addEventListener("click", () => {
        const age = btn.dataset.age;
        if (filters.ageRange === age) {
          filters.ageRange = null;
        } else {
          filters.ageRange = age;
        }
        document.querySelectorAll(".filter-age").forEach(b => {
          const active = b.dataset.age === filters.ageRange;
          b.classList.toggle("chip-active", active);
          b.classList.toggle("chip-inactive", !active);
        });
        renderList();
      });
    });

    document.querySelectorAll(".filter-category").forEach(btn => {
      btn.addEventListener("click", () => {
        const cat = btn.dataset.category;
        if (filters.categories.includes(cat)) {
          filters.categories = filters.categories.filter(c => c !== cat);
        } else {
          filters.categories.push(cat);
        }
        btn.classList.toggle("chip-active", filters.categories.includes(cat));
        btn.classList.toggle("chip-inactive", !filters.categories.includes(cat));
        renderList();
      });
    });

    document.querySelectorAll(".filter-feature").forEach(cb => {
      cb.addEventListener("change", () => {
        const feature = cb.dataset.feature;
        if (cb.checked) filters.features.push(feature);
        else filters.features = filters.features.filter(f => f !== feature);
        renderList();
      });
    });

    const favToggle = document.getElementById("fav-toggle");
    favToggle.addEventListener("click", () => {
      filters.onlyFavorites = !filters.onlyFavorites;
      favToggle.classList.toggle("bg-[#ff8c73]", filters.onlyFavorites);
      favToggle.classList.toggle("bg-[#f2d8cb]", !filters.onlyFavorites);
      favToggle.querySelector("span").style.left = filters.onlyFavorites ? "24px" : "4px";
      renderList();
    });

    document.getElementById("sort-select").addEventListener("change", (e) => {
      filters.sortBy = e.target.value;
      renderList();
    });

    document.getElementById("reset-btn").addEventListener("click", () => {
      filters = { query: "", ageRange: null, categories: [], features: [], onlyFavorites: false, sortBy: "relevance" };
      document.getElementById("search-input").value = "";
      document.querySelectorAll(".filter-age, .filter-category").forEach(b => {
        b.classList.remove("chip-active");
        b.classList.add("chip-inactive");
      });
      document.querySelectorAll(".filter-feature").forEach(cb => cb.checked = false);
      favToggle.classList.remove("bg-[#ff8c73]");
      favToggle.classList.add("bg-[#f2d8cb]");
      favToggle.querySelector("span").style.left = "4px";
      document.getElementById("sort-select").value = "relevance";
      renderList();
    });

    renderList();
  </script>
</body>
</html>
